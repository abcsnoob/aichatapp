name: Build Noob AI Ultimate Multi-Platform
on: [workflow_dispatch, push]

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            short_name: windows
          - os: macos-latest
            platform: darwin/universal
            short_name: macos
          - os: ubuntu-latest
            platform: linux/amd64
            short_name: linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - if: matrix.os == 'ubuntu-latest'
        name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config libglib2.0-dev

      - name: Build Desktop App
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          
          if [ "${{ matrix.short_name }}" == "linux" ]; then
            mkdir -p /tmp/pkgconfig
            cp /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.1.pc /tmp/pkgconfig/webkit2gtk-4.0.pc
            cp /usr/lib/x86_64-linux-gnu/pkgconfig/javascriptcoregtk-4.1.pc /tmp/pkgconfig/javascriptcoregtk-4.0.pc
            export PKG_CONFIG_PATH=/tmp/pkgconfig:$PKG_CONFIG_PATH
            export CGO_ENABLED=1
          fi
          wails build -platform ${{ matrix.platform }}

      - name: Package Assets
        shell: bash
        run: |
          mkdir -p final-dist
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            tar -czvf final-dist/noobai-linux.tar.gz -C build/bin/ .
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            cd build/bin && zip -r ../../final-dist/abcsnoob-macos.zip .
          else
            # Dùng PowerShell cho Windows để nén ZIP
            powershell -Command "Compress-Archive -Path build/bin/* -DestinationPath final-dist/abcsnoob-windows.zip -Force"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NoobAI-${{ matrix.short_name }}
          path: final-dist/*

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Force Build Android
        run: |
          if [ ! -f "package.json" ]; then
            echo '{"name": "abcsnoob-deepmind", "version": "1.3.0"}' > package.json
          fi
          
          npm install @capacitor/cli @capacitor/core @capacitor/android
          
          HTML_PATH=$(find . -name "index.html" -not -path "*/node_modules/*" | head -n 1)
          WEB_DIR=$(dirname "$HTML_PATH")
          
          # Xóa confirm để tránh lỗi unknown option
          npx cap init "Abcs Noob AI" "com.abcsnoob.deepmind.app" --web-dir "$WEB_DIR"
          npx cap add android
          
          # Copy và build
          npx cap copy android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NoobAI-Android
          path: "**/app-debug.apk"
