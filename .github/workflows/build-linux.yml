name: Build Noob AI Ultimate Multi-Platform
on: [workflow_dispatch, push]

jobs:
  # --- JOB 1: BUILD DESKTOP (Vẫn giữ nguyên vì Wails cần Go) ---
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            short_name: windows
          - os: macos-latest
            platform: darwin/universal
            short_name: macos
          - os: ubuntu-latest
            platform: linux/amd64
            short_name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
      - name: Build Desktop
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          wails build -platform ${{ matrix.platform }}
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NoobAI-${{ matrix.short_name }}
          path: build/bin/*

  # --- JOB 2: BUILD ANDROID (DÀNH CHO DỰ ÁN KHÔNG CÓ PACKAGE.JSON) ---
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android Environment & Build
        run: |
          # 1. Tìm thư mục chứa giao diện (nơi có index.html)
          HTML_PATH=$(find . -name "index.html" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$HTML_PATH" ]; then
            echo "Không tìm thấy file index.html nào!"
            exit 1
          fi
          WEB_DIR=$(dirname "$HTML_PATH")
          echo "Thư mục web được phát hiện: $WEB_DIR"

          # 2. Cài đặt Capacitor global vì không có package.json cục bộ
          npm install -g @capacitor/cli @capacitor/core @capacitor/android

          # 3. Khởi tạo Android
          # Chúng ta khởi tạo ngay tại thư mục gốc của project
          npx cap init "Noob AI" "dev.abcsnoob.deepmind.app" --web-dir "$WEB_DIR"
          
          # 4. Thêm nền tảng Android và bọc code
          npx cap add android
          npx cap copy android
          
          # 5. Thực hiện build APK bằng Gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NoobAI-Android
          path: "**/app-debug.apk"
