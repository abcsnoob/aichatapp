name: Build Noob AI Multi-Platform
on: [workflow_dispatch]

jobs:
  build:
    strategy:
      fail-fast: false # Không hủy các bản build khác nếu một bản bị lỗi
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: macos-latest
            platform: darwin/universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      # Sửa lỗi Exit Code 100: Cài đầy đủ thư viện đồ họa cho Linux
      - if: matrix.os == 'ubuntu-latest'
        name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config
        
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
        
      - name: Build App
        run: |
          # Đảm bảo lệnh wails có thể chạy được
          export PATH=$PATH:$(go env GOPATH)/bin
          wails build -platform ${{ matrix.platform }}
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoobAI-${{ matrix.platform }}
          path: build/bin/