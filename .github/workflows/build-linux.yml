name: Build Noob AI Multi-Platform
on: [workflow_dispatch, push]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            short_name: linux
          - os: macos-latest
            platform: darwin/universal
            short_name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - if: matrix.os == 'ubuntu-latest'
        name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config
          sudo ln -s /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.1.pc /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.0.pc
        
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
        
      - name: Build App
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          # Dọn rác file .exe cũ trước khi build
          rm -rf build/bin/*
          wails build -platform ${{ matrix.platform }}

      # Bước nén riêng cho Linux để giữ quyền thực thi
      - if: matrix.os == 'ubuntu-latest'
        name: Package Linux (.tar.gz)
        run: |
          tar -czvf noobai-linux.tar.gz -C build/bin/ .
          
      # Bước nén cho MacOS (giữ nguyên .zip cho "Bố Táo")
      - if: matrix.os == 'macos-latest'
        name: Package MacOS (.zip)
        run: |
          cd build/bin && zip -r ../../noobai-macos.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoobAI-${{ matrix.short_name }}-final
          # Tải lên file đã nén tương ứng
          path: |
            *.tar.gz
            *.zip
