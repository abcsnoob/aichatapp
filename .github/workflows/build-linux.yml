name: Build Noob AI Ultimate Multi-Platform
on: [workflow_dispatch, push]

jobs:
  # --- JOB 1: BUILD DESKTOP (WINDOWS, MAC, LINUX) ---
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            short_name: windows
          - os: macos-latest
            platform: darwin/universal
            short_name: macos
          - os: ubuntu-latest
            platform: linux/amd64
            short_name: linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go & Node
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config libglib2.0-dev

      - name: Build Desktop App
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          
          if [ "${{ matrix.short_name }}" == "linux" ]; then
            mkdir -p /tmp/pkgconfig
            cp /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.1.pc /tmp/pkgconfig/webkit2gtk-4.0.pc
            export PKG_CONFIG_PATH=/tmp/pkgconfig:$PKG_CONFIG_PATH
            export CGO_ENABLED=1
          fi
          wails build -platform ${{ matrix.platform }}

      - name: Package Assets
        shell: bash
        run: |
          mkdir -p final-dist
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            tar -czvf final-dist/AbcsNoobSocial.tar.gz -C build/bin/ .
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            cd build/bin && zip -r ../../final-dist/AbcsNoobSocial.zip .
          else
            powershell -Command "Compress-Archive -Path build/bin/* -DestinationPath final-dist/AbcsNoobSocial.zip -Force"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AbcsNoobSocial-${{ matrix.short_name }}
          path: final-dist/

  # --- JOB 2: BUILD ANDROID (FULL RELEASE + SIGNED) ---
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build & Sign Android
        run: |
          if [ ! -f "package.json" ]; then
            echo '{"name": "abcsnoob-deepmind", "version": "1.3.0"}' > package.json
          fi
          npm install @capacitor/cli @capacitor/core @capacitor/android
          
          HTML_PATH=$(find . -name "index.html" -not -path "*/node_modules/*" | head -n 1)
          WEB_DIR=$(dirname "$HTML_PATH")
          npx cap init "Abcs Noob AI" "com.abcsnoob.social.app" --web-dir "$WEB_DIR"
          npx cap add android
          
          sed -i '/dependencies {/i \
          configurations.all {\
              resolutionStrategy.eachDependency { details -> \
                  if (details.requested.group == "org.jetbrains.kotlin") { \
                      details.useVersion "1.8.22" \
                  } \
              } \
          }' android/app/build.gradle

          npx cap copy android
          
          keytool -genkey -v -keystore my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias my-alias -storepass abcsnoob123 -keypass abcsnoob123 \
            -dname "CN=Admin, OU=Abc's Noob DeepMind, O=Abc's Noob, L=Gialai, ST=Vietnam, C=VN"

          cd android && chmod +x gradlew
          ./gradlew assembleRelease
          
          APK_RAW=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner sign --ks ../my-release-key.jks \
            --ks-pass pass:abcsnoob123 --key-pass pass:abcsnoob123 \
            --out ../AbcsNoobSocial.apk $APK_RAW

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AbcsNoobSocial
          path: AbcsNoobSocial.apk
