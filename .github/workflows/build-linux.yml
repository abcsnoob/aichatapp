name: Build Noob AI Desktop
on: [workflow_dispatch, push]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            short_name: linux
          - os: macos-latest
            platform: darwin/universal
            short_name: macos
          - os: windows-latest
            platform: windows/amd64
            short_name: windows

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Cài đặt phụ thuộc cho Linux
      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config
          sudo ln -s /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.1.pc /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.0.pc

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build App
        shell: bash
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          # Build dựa trên platform trong matrix
          wails build -platform ${{ matrix.platform }}

      # Đóng gói cho từng hệ điều hành
      - name: Package Assets
        shell: bash
        run: |
          if [ "${{ matrix.short_name }}" == "linux" ]; then
            tar -czvf noobai-linux.tar.gz -C build/bin/ .
          elif [ "${{ matrix.short_name }}" == "macos" ]; then
            cd build/bin && zip -r ../../noobai-macos.zip .
          elif [ "${{ matrix.short_name }}" == "windows" ]; then
            cd build/bin && zip -r ../../noobai-windows.zip .
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoobAI-${{ matrix.short_name }}
          path: |
            *.tar.gz
            *.zip
