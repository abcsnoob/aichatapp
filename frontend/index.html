<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết nối mạng</title>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        #main-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #status-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background: #28a745;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 24px;
            font-family: sans-serif;

            z-index: 9999;

            pointer-events: none;
            overflow-y: auto;

            transition: background 0.5s ease, opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <iframe id="main-iframe" src="https://asocial.elementfx.com"></iframe>

    <!-- Overlay -->
    <div id="status-overlay">Trở lại trực tuyến</div>

    <script>
        const overlay = document.getElementById('status-overlay');

        let wasOffline = false;

        // Hiện mặc định 2 giây
        setTimeout(() => {
            overlay.style.display = 'none';
        }, 2000);

        async function checkConnection() {
            const controller = new AbortController();

            const timeoutId = setTimeout(() => {
                controller.abort();
            }, 5000);

            try {
                await fetch('https://asocial.elementfx.com', {
                    mode: 'no-cors',
                    signal: controller.signal
                });

                // Có mạng trở lại
                if (wasOffline) {
                    overlay.textContent = "Trở lại trực tuyến";
                    overlay.style.background = "#28a745";
                    overlay.style.display = "flex";

                    wasOffline = false;

                    setTimeout(() => {
                        overlay.style.display = 'none';
                    }, 2000);
                }

            } catch (error) {

                // Mất mạng
                overlay.textContent = "Không có internet";
                overlay.style.background = "#808080";
                overlay.style.display = "flex";

                wasOffline = true;
            } finally {
                clearTimeout(timeoutId);
            }
        }

        // Kiểm tra lần đầu sau 2 giây
        setTimeout(checkConnection, 2000);

        // Kiểm tra định kỳ mỗi 20 giây
        setInterval(checkConnection, 20000);
    </script>

</body>
</html>
