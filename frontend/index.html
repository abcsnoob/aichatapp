<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noob AI | System Gateway</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary: #00d2ff; --bg: #0b0e11; --danger: #ff4d4d; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; overflow: hidden; margin: 0; display: flex; align-items: center; justify-content: center; }
        
        #no-internet-overlay {
            position: fixed; inset: 0; background: var(--bg);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999;
        }
        .error-box {
            background: rgba(255, 77, 77, 0.05); border: 2px solid var(--danger);
            padding: 30px 50px; border-radius: 20px; font-weight: bold; font-size: 18px;
            color: var(--danger); box-shadow: 0 0 30px rgba(255, 77, 77, 0.1);
        }
        .loader { width: 50px; height: 50px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="no-internet-overlay">
        <div class="error-box">
            [ BẠN ĐANG KHÔNG CÓ KẾT NỐI INTERNET ]
        </div>
        <button class="btn btn-outline-light mt-4 px-4 py-2" onclick="checkConnection()">THỬ LẠI NGAY</button>
    </div>

    <div id="loading-screen" class="text-center">
        <div class="loader mb-3 mx-auto"></div>
        <h5 class="fw-bold text-uppercase opacity-75">Đang kiểm tra tín hiệu...</h5>
    </div>

    <script>
        const WORKER_URL = 'https://abcsnoobai.abcsnoob.workers.dev';

        async function checkConnection() {
            const overlay = document.getElementById('no-internet-overlay');
            const loader = document.getElementById('loading-screen');
            
            overlay.style.display = 'none';
            loader.style.display = 'block';

            // Bước 1: Kiểm tra phần cứng mạng (Wi-Fi/LAN)
            if (!navigator.onLine) {
                showError();
                return;
            }

            try {
                // Bước 2: Thử gọi API thực tế. Thêm timeout để không bắt người dùng đợi lâu.
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);

                const res = await fetch(WORKER_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: 'ping' }),
                    signal: controller.signal
                }).catch(() => ({ ok: false }));

                clearTimeout(timeoutId);

                // Nếu Worker trả về OK hoặc ít nhất trình duyệt báo vẫn đang Online
                if (res.ok || navigator.onLine) {
                    window.location.replace('chat.html');
                } else {
                    showError();
                }
            } catch (e) {
                showError();
            }
        }

        function showError() {
            document.getElementById('no-internet-overlay').style.display = 'flex';
            document.getElementById('loading-screen').style.display = 'none';
        }

        window.onload = checkConnection;
        window.addEventListener('offline', showError);
        window.addEventListener('online', checkConnection);
    </script>
</body>
</html>
