<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết nối mạng</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
        
        #main-iframe { width: 100%; height: 100%; border: none; }

        #status-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #808080; color: white;
            display: none; align-items: center; justify-content: center;
            font-size: 24px; z-index: 9999;
            /* Cho phép cuộn nhưng chặn tương tác chạm vào iframe bên dưới */
            pointer-events: none;
            overflow-y: auto;
            transition: background 1s ease; /* Thêm transition cho background */
        }
    </style>
</head>
<body>

    <iframe id="main-iframe" src="https://social.unaux.com"></iframe>
    <div id="status-overlay"></div> <!- Thêm div để chứa text ->

    <script>
        const overlay = document.getElementById('status-overlay');
        const overlayText = overlay; <!- Đổi tên biến để dễ hiểu hơn ->
        let wasOffline = false;

        async function checkConnection() {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);

            try {
                // Kiểm tra bằng cách fetch chính trang web hoặc 1 file trên server
                await fetch('https://social.unaux.com', { mode: 'no-cors', signal: controller.signal });
                
                // NẾU CÓ MẠNG
                if (wasOffline) {
                    overlayText.textContent = "Trở lại trực tuyến";
                    overlay.style.background = "#28a745"; // Đổi màu sang xanh lá
                    wasOffline = false;
                    setTimeout(() => {
                        overlay.style.display = 'none';
                    }, 1000); // Ẩn overlay sau 1s (để kịp nhìn thấy màu xanh lá)
                } else {
                     overlay.style.display = 'none'; // Ẩn overlay nếu không bị mất mạng
                }
            } catch (error) {
                // NẾU KHÔNG CÓ MẠNG
                overlayText.textContent = "Không có internet";
                overlay.style.background = "#808080"; // Đổi màu về xám
                overlay.style.display = 'flex';
                wasOffline = true;
            } finally {
                clearTimeout(timeoutId);
            }
        }

        // Kiểm tra ngay khi tải trang
        checkConnection();

        // Kiểm tra định kỳ mỗi 20 giây
        setInterval(checkConnection, 20000);
    </script>
</body>
</html>
